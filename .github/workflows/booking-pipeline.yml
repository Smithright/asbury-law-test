# Booking pipeline release flow (see pipeline/README.md).
#   any push to mvp-preview                   -> test, build, deploy to TESTING, tag tested-<sha>
#   Actions > booking-pipeline > Run workflow  -> promote an already-tested <sha> to an IDLE prod slot
# Going live / rolling back is NOT done here: it is the one-line active_slot comment (migration 005).
name: booking-pipeline

on:
  push:
    branches: [mvp-preview]      # every commit goes to testing; site and pipeline ship together
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA that already passed testing (tag tested-<sha> must exist)"
        required: true
      slot:
        description: "Prod slot to deploy into (must be the standby slot)"
        type: choice
        options: [prod-green, prod-blue]
        required: true

permissions:
  contents: write

concurrency:
  group: booking-pipeline
  cancel-in-progress: false

jobs:
  testing:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test pipeline/test/*.test.mjs
      - name: Build testing
        run: node pipeline/build.mjs testing
      - name: Deploy to testing (clasp push as smithright@)
        env:
          CLASPRC: ${{ secrets.CLASPRC_TESTING }}
        run: |
          test -n "$CLASPRC" || { echo "::error::secret CLASPRC_TESTING is not set"; exit 1; }
          umask 077 && printf '%s' "$CLASPRC" > ~/.clasprc.json
          cd pipeline/dist/testing && npx --yes @google/clasp@2.4.2 push --force
          rm -f ~/.clasprc.json
      - name: Mark commit as tested
        run: |
          git tag "tested-${GITHUB_SHA}"
          git push origin "tested-${GITHUB_SHA}"

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ inputs.sha }}
      SLOT: ${{ inputs.slot }}
    steps:
      - name: Validate input
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-char commit SHA"; exit 1; }
          [[ "$SLOT" == prod-blue || "$SLOT" == prod-green ]] || { echo "::error::bad slot"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Require that this exact commit passed testing
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/tested-${SHA}" >/dev/null ||
          git ls-remote --exit-code --tags origin "refs/tags/staged-${SHA}" >/dev/null ||   # tag name before 2026-10-16
          { echo "::error::${SHA} was never deployed to testing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test pipeline/test/*.test.mjs
      - name: Build slot
        run: |
          node pipeline/build.mjs "$SLOT"
          if grep -q '"scriptId": "TBD' "pipeline/dist/$SLOT/.clasp.json"; then echo "::error::$SLOT has no scriptId yet"; exit 1; fi
      - name: Deploy (clasp push as tom@)
        env:
          CLASPRC: ${{ secrets.CLASPRC_PROD }}
        run: |
          test -n "$CLASPRC" || { echo "::error::secret CLASPRC_PROD is not set"; exit 1; }
          umask 077 && printf '%s' "$CLASPRC" > ~/.clasprc.json
          cd "pipeline/dist/$SLOT" && npx --yes @google/clasp@2.4.2 push --force
          rm -f ~/.clasprc.json
      - name: Deploy the slot's website (move release-<color> to this commit; Vercel builds it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COLOR="${SLOT#prod-}"
          REF="repos/${GITHUB_REPOSITORY}/git/refs/heads/release-${COLOR}"
          if gh api "$REF" >/dev/null 2>&1; then
            gh api -X PATCH "$REF" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/release-${COLOR}" -f sha="$SHA" >/dev/null
          fi
          echo "release-${COLOR} -> ${SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Record promotion
        run: |
          git tag "promoted-${SLOT}-${SHA}"
          git push origin "promoted-${SLOT}-${SHA}"
          echo "Deployed ${SHA} to ${SLOT} (standby until active_slot is flipped)." >> "$GITHUB_STEP_SUMMARY"
